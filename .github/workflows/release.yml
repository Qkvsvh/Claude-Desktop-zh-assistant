name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to"
        required: false
        default: "v1.5"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and package
        shell: powershell
        run: .\build.ps1
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCZhAssistant-windows
          path: dist/CCZhAssistant-windows.zip

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app and ZIP
        shell: bash
        run: bash macOS/build-macos.sh
      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCZhAssistant-macOS-apple-silicon
          path: dist/CCZhAssistant-macOS-apple-silicon.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow
      - name: Build Linux app and ZIP
        shell: bash
        run: bash linux/build-linux.sh
      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCZhAssistant-linux
          path: dist/CCZhAssistant-linux.zip

  publish:
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    needs: [build, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish or update tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v1.5' }}
        run: |
          gh release upload "$TAG_NAME" dist/*.zip --clobber || gh release create "$TAG_NAME" dist/*.zip --generate-notes --title "Claude Code 桌面版中文助手 $TAG_NAME"
